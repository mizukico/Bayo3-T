name: Test Baidu Netdisk Upload Action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-probe:
    name: Upload a 4000 MiB (over 4 GB) probe file
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check Baidu credentials are configured
        shell: bash
        env:
          BDUSS: ${{ secrets.BDUSS }}
          STOKEN: ${{ secrets.STOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${BDUSS:-}" ]]; then
            echo "::error::Repository secret BDUSS is missing."
            exit 1
          fi
          if [[ -z "${STOKEN:-}" ]]; then
            echo "::error::Repository secret STOKEN is missing."
            exit 1
          fi
          echo "Both required Baidu credentials are present."

      - name: Check runner disk space and generate a unique 4000 MiB test file
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/baidu-action-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bin"
          REQUIRED_BYTES=$((4000 * 1024 * 1024))
          AVAILABLE_BYTES=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')
          echo "Runner temp free space: $((AVAILABLE_BYTES / 1024 / 1024)) MiB"
          if (( AVAILABLE_BYTES < REQUIRED_BYTES + 2 * 1024 * 1024 * 1024 )); then
            echo "::error::Insufficient runner disk space for a 4000 MiB test file plus 2 GiB reserve."
            exit 1
          fi
          dd if=/dev/urandom of="$FILE" bs=1M count=4000 status=progress
          test "$(stat -c '%s' "$FILE")" -eq "$REQUIRED_BYTES"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$FILE")" >> "$GITHUB_OUTPUT"
          echo "Generated 4000 MiB upload probe: $(basename "$FILE")"

      - name: Create a unique remote test folder
        shell: bash
        env:
          BDUSS: ${{ secrets.BDUSS }}
          STOKEN: ${{ secrets.STOKEN }}
        run: |
          set -euo pipefail
          VERSION="v4.0.2"
          ARCHIVE="$RUNNER_TEMP/baidupcs.zip"
          EXTRACT="$RUNNER_TEMP/baidupcs-cli"
          REMOTE_DIR="/Baidu-Action-Test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          curl -fsSL "https://github.com/qjfoidnh/BaiduPCS-Go/releases/download/${VERSION}/BaiduPCS-Go-${VERSION}-linux-amd64.zip" -o "$ARCHIVE"
          mkdir -p "$EXTRACT"
          unzip -q "$ARCHIVE" -d "$EXTRACT"
          BIN="$(find "$EXTRACT" -type f -name 'BaiduPCS-Go' -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"

          "$BIN" login "-bduss=$BDUSS" "-stoken=$STOKEN"
          "$BIN" mkdir "$REMOTE_DIR"
          echo "remote_dir=$REMOTE_DIR" >> "$GITHUB_ENV"
          echo "Created remote test folder: $REMOTE_DIR"

      - name: Upload probe with CHC383 Baidu Netdisk Action
        uses: CHC383/baidu-netdisk-upload-action@38c6fdcb66d4ca398467264db5532947d12ff113
        with:
          bduss: ${{ secrets.BDUSS }}
          stoken: ${{ secrets.STOKEN }}
          target: ${{ steps.probe.outputs.path }}
          remote-dir: ${{ env.remote_dir }}
          upload-policy: skip

      - name: Report uploaded test file
        shell: bash
        env:
          PROBE_NAME: ${{ steps.probe.outputs.filename }}
          REMOTE_DIR: ${{ env.remote_dir }}
        run: |
          {
            echo "## Baidu Netdisk Action test"
            echo
            echo "The Action completed successfully for a 4000 MiB (4.19 GB) test file."
            echo
            printf 'Remote path: %s/%s\n' "$REMOTE_DIR" "$PROBE_NAME"
            echo
            echo "The test file is intentionally left in its uniquely named folder for manual verification."
          } >> "$GITHUB_STEP_SUMMARY"
